name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.2.0
        required: true
        type: string

      prerelease:
        description: Mark as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Release tag must start with 'v'"
            exit 1
          fi

  build-unix:
    name: Package ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            shared_library: build-shared/libneurosdk.so

          - os: macos-latest
            platform: macos
            shared_library: build-shared/libneurosdk.dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Build libraries
        run: |
          cmake \
            -S . \
            -B build-shared \
            -G Ninja \
            -DNEURO_BUILD_STATIC=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-shared --parallel

          cmake \
            -S . \
            -B build-static \
            -G Ninja \
            -DNEURO_BUILD_STATIC=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-static --parallel

      - name: Package libraries
        run: |
          mkdir artifacts

          cp "${{ matrix.shared_library }}" artifacts/
          cp build-static/libneurosdk.a artifacts/
          cp include/neurosdk.h artifacts/
          cp LICENSE artifacts/

          tar -czf \
            "libneurosdk-${{ matrix.platform }}.tar.gz" \
            -C artifacts .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: libneurosdk-${{ matrix.platform }}
          path: libneurosdk-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: Package Windows ${{ matrix.arch }}
    needs: validate
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - amd64_x86
          - amd64_arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install dependencies
        run: choco install -y cmake ninja

      - name: Build libraries
        run: |
          cmake `
            -S . `
            -B build-shared `
            -G Ninja `
            -DNEURO_BUILD_STATIC=OFF `
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-shared --parallel

          cmake `
            -S . `
            -B build-static `
            -G Ninja `
            -DNEURO_BUILD_STATIC=ON `
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-static --parallel

      - name: Package libraries
        run: |
          New-Item -ItemType Directory -Force artifacts

          Copy-Item build-shared/neurosdk.dll artifacts/libneurosdk.dll
          Copy-Item build-shared/neurosdk.lib artifacts/libneurosdk.lib
          Copy-Item build-static/neurosdk.lib artifacts/libneurosdk_static.lib
          Copy-Item include/neurosdk.h artifacts/
          Copy-Item LICENSE artifacts/

          tar -czf `
            "libneurosdk-windows-${{ matrix.arch }}.tar.gz" `
            -C artifacts .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: libneurosdk-windows-${{ matrix.arch }}
          path: libneurosdk-windows-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - build-unix
      - build-windows

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Display packages
        run: ls -lah dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.tar.gz
